name: Release

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Release branch (e.g. release-1.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: Parse version from release.yaml
        id: parse
        run: |
          chmod +x .github/scripts/parse-version.sh
          .github/scripts/parse-version.sh

      - name: Validate branch matches version
        run: |
          EXPECTED_BRANCH="release-${{ steps.parse.outputs.major }}.${{ steps.parse.outputs.minor }}"
          if [[ "${{ inputs.release-branch }}" != "$EXPECTED_BRANCH" ]]; then
            echo "::error::Branch '${{ inputs.release-branch }}' does not match version ${{ steps.parse.outputs.version }} (expected branch: $EXPECTED_BRANCH)"
            exit 1
          fi

  smoke-tests:
    needs: read-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: "PLACEHOLDER: Lint"
        run: echo "PLACEHOLDER -- run linter here (e.g., golangci-lint run, shellcheck)"

      - name: "PLACEHOLDER: Format check"
        run: echo "PLACEHOLDER -- run format check (e.g., gofmt -l ., rustfmt --check)"

      - name: "PLACEHOLDER: Bundle validation"
        run: echo "PLACEHOLDER -- validate OLM bundle (e.g., operator-sdk bundle validate)"

      - name: "PLACEHOLDER: Unit tests"
        run: echo "PLACEHOLDER -- run unit tests (e.g., make test, cargo test)"

  tag:
    needs: [read-version, smoke-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          fetch-depth: 0

      - name: Create and push tag
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build-operator-image:
    needs: [read-version, tag]
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: "PLACEHOLDER: Build and push operator image"
        id: build
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          IMAGE_REF="quay.io/kuadrant/workflow-layout:v${VERSION}"
          echo "PLACEHOLDER -- build and push: $IMAGE_REF"
          echo "PLACEHOLDER -- multi-arch: amd64, arm64, s390x, ppc64le"
          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

  build-bundle-image:
    needs: [read-version, build-operator-image]
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: "PLACEHOLDER: Build and push bundle image"
        id: build
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          OPERATOR_IMAGE="${{ needs.build-operator-image.outputs.image-ref }}"
          BUNDLE_REF="quay.io/kuadrant/workflow-layout-bundle:v${VERSION}"
          echo "PLACEHOLDER -- build bundle using operator image: $OPERATOR_IMAGE"
          echo "PLACEHOLDER -- push: $BUNDLE_REF"
          echo "image-ref=$BUNDLE_REF" >> "$GITHUB_OUTPUT"

  build-catalog-image:
    needs: [read-version, build-bundle-image]
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: "PLACEHOLDER: Build and push catalog image"
        id: build
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          BUNDLE_IMAGE="${{ needs.build-bundle-image.outputs.image-ref }}"
          CATALOG_REF="quay.io/kuadrant/workflow-layout-catalog:v${VERSION}"
          echo "PLACEHOLDER -- build catalog using bundle image: $BUNDLE_IMAGE"
          echo "PLACEHOLDER -- push: $CATALOG_REF"
          echo "image-ref=$CATALOG_REF" >> "$GITHUB_OUTPUT"

  build-helm-charts:
    needs: [read-version, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: "PLACEHOLDER: Package helm charts"
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          echo "PLACEHOLDER -- helm package with version $VERSION"
          echo "PLACEHOLDER -- helm chart artifact created"

      - name: "PLACEHOLDER: Open PR to helm-charts repo"
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          echo "PLACEHOLDER -- create PR to kuadrant-labs/helm-charts"
          echo "PLACEHOLDER -- this uses 'gh pr create' against the helm-charts repo"
          echo "PLACEHOLDER -- requires a PAT or GitHub App token with cross-repo permissions"

  build-binaries:
    needs: [read-version, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: "PLACEHOLDER: Build project binaries"
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          echo "PLACEHOLDER -- build binaries for version $VERSION"
          echo "PLACEHOLDER -- targets: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64"

  create-release:
    needs: [read-version, build-catalog-image, build-helm-charts, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"

          # PLACEHOLDER: attach binary artifacts
          # gh release upload "$TAG" dist/*.tar.gz
